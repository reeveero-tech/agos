name: governance-and-tests
on:
  push:
  pull_request:
jobs:
  governance:
    name: Governance gate (G1 documentation, G2 no deletion)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Check every commit in the push / PR
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            RANGE="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event.before }}" = "0000000000000000000000000000000000000000" ]; then
            RANGE="${{ github.sha }}"
          else
            RANGE="${{ github.event.before }}..${{ github.sha }}"
          fi
          python tools/governance/check_commit.py --range "$RANGE"
  tests:
    name: Test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen --python 3.12
      - name: Every test_*.py file holds real assertions (R-Q-001)
        run: uv run python tools/quality/assert_audit.py
      - run: uv run python tools/quality/run_tests.py
  clean-environment:
    name: Clean environment (R-F-011 — runtime dependencies only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
      - run: uv python install 3.12
      - name: Dependency audit is fresh and has no problems
        run: uv run --frozen --python 3.12 python tools/audit/dependencies.py --check
      - name: Every runtime module imports with only the locked runtime dependencies
        run: uv run --frozen --python 3.12 python tools/audit/clean_env.py --check
