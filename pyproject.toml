# R-F-001: real packaging. Was a Replit placeholder ("repl-nix-workspace", no build system).
[project]
name = "agos"
version = "0.1.0.dev0"
description = "AGOS — Autonomous General Orchestration System: an operating system for autonomous software engineering (one brain, many providers)."
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "reeveero-tech" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Development Status :: 2 - Pre-Alpha",
]
# Runtime dependencies actually imported by the code (tools/audit inventory, R-F-001):
dependencies = [
    "requests>=2.34.2",        # kernel: laboratory, certification, sdk runtimes
    "pyyaml>=6.0.3",           # rie: application/dna_generator
    "psutil>=7.2.2",           # kernel: hardening/runtime
    "memory-profiler>=0.61.0", # kernel: hardening/runtime
]

[project.urls]
Repository = "https://github.com/reeveero-tech/agos"

[project.scripts]
# The current working entry point (agos/agos-kernel/main.py), runnable after install.
agos-analyze = "agos.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# The whole agos/ tree ships as the `agos` package (kernel directory included as-is,
# hyphenated names and all — they are reached through the alias packages, ADR-0001).
packages = ["agos"]
exclude = ["**/__pycache__", "**/*.pyc", "agos/push_to_github.sh"]

[tool.hatch.build.targets.wheel.force-include]
# Top-level `agos_kernel` (R-F-003) for installed environments.
"tools/packaging/agos_kernel_installed.py" = "agos_kernel/__init__.py"

[tool.hatch.build.targets.sdist]
exclude = ["**/__pycache__", "**/*.pyc", ".venv"]

[tool.pytest.ini_options]
testpaths = ["agos/agos-kernel", "tests"]
# R-F-009: plain `async def test_*` functions run on an event loop (pytest-asyncio).
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
